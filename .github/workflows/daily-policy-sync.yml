name: Daily Regalis Policy Sync

on:
  schedule:
    - cron: '30 0 * * *' # Runs daily at 06:00 AM IST
  workflow_dispatch: # Allows manual "Run workflow" button in GitHub Actions

jobs:
  sync-policies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 supabase google-genai

      - name: Run automated multi-sector scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python daily_scraper.py
